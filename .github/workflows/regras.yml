name: regras

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Sintaxe dos scripts
        run: |
          bash -n testes/bateria.sh
          python3 -m py_compile cenarios/gen_cenarios.py testes/matriz.py
      - name: Regras bem formadas
        run: |
          # cada regra ativa tem msg, sid e rev; SIDs únicos
          python3 - <<'PY'
          import re, sys, collections
          sids = []
          for linha in open("regras/n4.rules", encoding="utf-8"):
              if not linha.startswith("alert "):
                  continue
              for campo in ("msg:", "sid:", "rev:"):
                  if campo not in linha:
                      sys.exit(f"falta {campo} em: {linha[:80]}")
              sids.append(re.search(r"sid:(\d+)", linha).group(1))
          dup = [s for s, n in collections.Counter(sids).items() if n > 1]
          if dup:
              sys.exit(f"SIDs duplicados: {dup}")
          print(len(sids), "regras ativas, SIDs únicos")
          PY

  matriz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # O runner traz Suricata 7.0.3, que não serve. Usa o 8.0.7 em contentor,
      # com o output em /tmp/out (o contentor corre com outro utilizador e não
      # escreve no diretório de trabalho).
      - name: Suricata 8.0.7 em contentor
        run: |
          mkdir -p /tmp/out /tmp/suri-log
          chmod -R 777 /tmp/out /tmp/suri-log
          cat > /tmp/suri <<'SH'
          #!/bin/sh
          exec docker run --rm --entrypoint suricata \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v /tmp:/tmp -w "$GITHUB_WORKSPACE" \
            jasonish/suricata:8.0.7 "$@"
          SH
          chmod +x /tmp/suri
          /tmp/suri --build-info | grep -m1 "This is Suricata version"
          /tmp/suri --build-info | grep -q "version 8.0.7"
      - name: Validar regras (suricata -T)
        run: |
          /tmp/suri -T -c testes/suricata-lab.yaml -S regras/n4.rules -l /tmp/suri-log
      - name: Matriz dos 19 pcaps
        run: |
          sed -i 's#^SURI = .*#SURI = "/tmp/suri"#' testes/matriz.py
          python3 -I testes/matriz.py regras/n4.rules cenarios/pcaps /tmp/out/matriz.json
      - name: Verificar resultados
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open("/tmp/out/matriz.json"))
          benignos = sum(sum(v.values()) for k, v in d.items() if k.startswith("benigno_"))
          ataques = {k: sum(v.values()) for k, v in d.items() if k.startswith("ataque_")}
          total = sum(ataques.values())
          print("benignos:", benignos, "| ataques (alertas):", total, "| pcaps:", len(d))
          # -T1 em portas comuns é um limite conhecido (README): não exigir alerta.
          sem_alerta = [k for k, n in ataques.items() if n == 0 and k != "ataque_sS_comuns_T1"]
          if benignos:
              sys.exit("falsos positivos em tráfego benigno")
          if sem_alerta:
              sys.exit(f"ataques sem alerta: {sem_alerta}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matriz
          path: /tmp/out/matriz.json
